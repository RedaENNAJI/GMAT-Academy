<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GMAT Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --ink:#172036; --ink-2:#232E4D; --ink-3:#33406A;
  --paper:#F5F6F9; --white:#FFFFFF; --line:#DCE1EA; --text:#1E2433; --muted:#5D6678;
  --signal:#F2B705; --q:#2F6FED; --v:#7C4DDB; --di:#0F9B8E; --ok:#1E9E5A; --bad:#D2453F;
  --ui:'Archivo','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --read:'Source Serif 4',Georgia,'Times New Roman',serif;
  --r-s:6px; --r-m:10px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--text);font-family:var(--ui);font-size:16px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
a{color:var(--q)}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- Barre du haut ---------- */
.top{background:var(--ink);color:#fff;position:sticky;top:0;z-index:20}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:24px;padding:12px 20px;flex-wrap:wrap}
.brand{font-weight:800;font-stretch:115%;font-size:1.15rem;letter-spacing:.01em;display:flex;align-items:center;gap:10px;cursor:pointer;background:none;border:0;color:#fff;padding:0}
.brand-mark{width:26px;height:26px;border-radius:4px;background:
  conic-gradient(var(--signal) 0 25%,var(--ink) 0 50%,var(--signal) 0 75%,var(--ink) 0) 0 0/13px 13px;border:2px solid var(--signal)}
.nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.nav button{background:none;border:0;color:#C9D0E2;padding:8px 12px;border-radius:var(--r-s);cursor:pointer;font-weight:600}
.nav button:hover{color:#fff;background:var(--ink-2)}
.nav button.on{color:var(--ink);background:var(--signal)}

.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 60px}
h1,h2,h3{font-stretch:110%;line-height:1.15;margin:0 0 .5em}
h1{font-size:2rem;font-weight:800}
h2{font-size:1.45rem;font-weight:750}
h3{font-size:1.1rem;font-weight:700}
.muted{color:var(--muted)}
.lead{max-width:62ch}

/* ---------- Héros : le circuit ---------- */
.hero{background:var(--ink);color:#fff;padding:26px 0 18px}
.hero-in{max-width:1180px;margin:0 auto;padding:0 20px}
.hero-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.hero h1{font-size:clamp(1.8rem,4vw,2.8rem);font-stretch:118%;margin:0}
.hero p{color:#B9C2D8;margin:.3em 0 0;max-width:60ch}
.hero-stat{font-weight:700;color:var(--signal);font-size:1.05rem}
.circuit{width:100%;height:auto;display:block}
.circuit .node{cursor:pointer}
.circuit .node:focus{outline:none}
.circuit .node:focus-visible .ring{stroke:var(--signal);stroke-width:4}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:.85rem;color:#B9C2D8;margin-top:4px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:50%;display:inline-block}

/* ---------- Panneau d'étape ---------- */
.panel{background:var(--white);border:1px solid var(--line);border-radius:var(--r-m);padding:26px;margin-top:-6px}
.panel-head{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.step-num{font-weight:800;font-stretch:120%;font-size:2.6rem;line-height:1;color:var(--ink)}
.chip{display:inline-block;font-size:.8rem;font-weight:700;padding:3px 10px;border-radius:999px;color:#fff}
.chip.Q{background:var(--q)} .chip.V{background:var(--v)} .chip.DI{background:var(--di)} .chip.X{background:var(--signal);color:var(--ink)}
.chip.prio{background:var(--bad)}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:20px}
.act{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-m);padding:18px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.act:hover{border-color:var(--ink-3)}
.act b{font-size:1.05rem}
.act .st{font-size:.85rem;color:var(--muted)}
.act .st.done{color:var(--ok);font-weight:700}
.banner{background:#FFF7DB;border:1px solid #F0D98A;border-radius:var(--r-m);padding:14px 18px;margin:18px 0;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.official{border-top:1px solid var(--line);margin-top:22px;padding-top:18px}

/* ---------- Boutons ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:var(--r-s);padding:11px 20px;font-weight:700;cursor:pointer;background:var(--ink);color:#fff;text-decoration:none}
.btn:hover{background:var(--ink-3)}
.btn.sig{background:var(--signal);color:var(--ink)} .btn.sig:hover{background:#FFC928}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.ghost:hover{background:var(--ink);color:#fff}
.btn.sm{padding:7px 14px;font-size:.9rem}
.btn.danger{background:var(--bad)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* ---------- Fiches ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-top:20px}
.fcard{perspective:1000px;height:210px;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.fcard-in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.fcard.flip .fcard-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--r-m);padding:20px;display:flex;flex-direction:column;justify-content:center;overflow:auto}
.front{background:var(--ink);color:#fff;font-weight:700;font-size:1.1rem;font-stretch:108%}
.front small{display:block;font-weight:500;color:#9FAAC6;font-size:.8rem;margin-top:12px;font-stretch:100%}
.back{background:var(--white);border:2px solid var(--ink);transform:rotateY(180deg);font-size:.95rem;line-height:1.55}
.fcard.seen .front{box-shadow:inset 0 -5px 0 var(--signal)}

/* ---------- Questions ---------- */
.qbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--ink);color:#fff;padding:10px 20px;border-radius:var(--r-m) var(--r-m) 0 0}
.qbar .sp{flex:1}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.15rem;background:var(--ink-2);padding:4px 12px;border-radius:var(--r-s)}
.timer.low{background:var(--bad)}
.qbox{background:var(--white);border:1px solid var(--line);border-top:0;border-radius:0 0 var(--r-m) var(--r-m);padding:26px}
.qgrid{display:grid;gap:28px}
.qgrid.split{grid-template-columns:1fr 1fr}
@media (max-width:860px){.qgrid.split{grid-template-columns:1fr}}
.stim{font-family:var(--read);font-size:1.02rem;line-height:1.7;max-height:70vh;overflow:auto;padding-right:8px}
.stim h4{font-family:var(--ui);margin:0 0 8px}
.qtext{font-family:var(--read);font-size:1.08rem;line-height:1.65;margin-bottom:18px}
.qsub{font-family:var(--ui);font-size:.8rem;font-weight:700;color:var(--muted);margin-bottom:6px}
.ds-st{margin-top:12px}.ds-st p{margin:.35em 0}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);border-radius:var(--r-s);padding:11px 14px;cursor:pointer;background:var(--white);text-align:left;font-family:var(--read);font-size:1rem}
.opt:hover{border-color:var(--ink-3)}
.opt .L{font-family:var(--ui);font-weight:800;min-width:1.4em;color:var(--muted)}
.opt.sel{border-color:var(--ink);background:#EEF1F8}
.opt.sel .L{color:var(--ink)}
.opt.ok{border-color:var(--ok);background:#E7F6EE}
.opt.ko{border-color:var(--bad);background:#FCEBEA}
.opt[disabled]{cursor:default}
.mtable{width:100%;border-collapse:collapse;font-family:var(--read)}
.mtable th,.mtable td{border-bottom:1px solid var(--line);padding:10px 8px;text-align:left;vertical-align:middle}
.mtable th{font-family:var(--ui);font-size:.85rem;color:var(--muted)}
.mtable td.c{text-align:center;width:72px}
.rad{width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);background:var(--white);cursor:pointer;padding:0;display:inline-block}
.rad.sel{background:var(--ink);border-color:var(--ink);box-shadow:inset 0 0 0 4px var(--white)}
.rad.ok{border-color:var(--ok);background:var(--ok);box-shadow:inset 0 0 0 4px var(--white)}
.rad.ko{border-color:var(--bad);background:var(--bad);box-shadow:inset 0 0 0 4px var(--white)}
.gi p{font-family:var(--read);margin:0 0 14px;line-height:1.9}
.gi select{border:1.5px solid var(--ink);border-radius:var(--r-s);padding:4px 8px;background:var(--white);font-family:var(--ui)}
.gi select.ok{border-color:var(--ok);background:#E7F6EE}.gi select.ko{border-color:var(--bad);background:#FCEBEA}
.dtable{border-collapse:collapse;width:100%;font-family:var(--ui);font-size:.92rem}
.dtable caption{text-align:left;font-weight:700;margin-bottom:8px}
.dtable th,.dtable td{border:1px solid var(--line);padding:7px 10px;text-align:right}
.dtable th:first-child,.dtable td:first-child{text-align:left}
.dtable th{background:var(--paper)}
.chart{width:100%;height:auto;font-family:var(--ui)}
.chart .ct{font-weight:700;font-size:13px;fill:var(--text)} .chart .cl{font-size:11px;fill:var(--muted)} .chart .cv{font-size:11px;font-weight:700;fill:var(--text)}
.chart .cg{stroke:var(--line)} .chart .cb{fill:var(--di)} .chart .cline{fill:none;stroke:var(--di);stroke-width:2.5} .chart .cdot{fill:var(--di)}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--ink);margin-bottom:12px}
.tabs button{border:0;background:var(--paper);padding:7px 14px;border-radius:var(--r-s) var(--r-s) 0 0;cursor:pointer;font-weight:600}
.tabs button.on{background:var(--ink);color:#fff}
.feedback{margin-top:18px;padding:16px 18px;border-radius:var(--r-m);border-left:5px solid var(--ok);background:#F0F9F4}
.feedback.ko{border-left-color:var(--bad);background:#FDF1F0}
.feedback b{display:block;margin-bottom:4px}
.qfoot{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;flex-wrap:wrap}

/* ---------- Résultats, listes ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin:18px 0}
.kpi{background:var(--white);border:1px solid var(--line);border-radius:var(--r-m);padding:16px}
.kpi b{display:block;font-size:1.9rem;font-weight:800;font-stretch:115%;line-height:1.1}
.kpi span{color:var(--muted);font-size:.88rem}
.kpi.big{background:var(--ink);color:#fff;border-color:var(--ink)} .kpi.big span{color:#B9C2D8} .kpi.big b{color:var(--signal);font-size:2.4rem}
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--r-m);padding:22px;margin-top:18px}
.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:minmax(150px,260px) 1fr 52px;gap:12px;align-items:center;font-size:.92rem}
.bar{height:12px;background:var(--paper);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%}
.review-item{border-bottom:1px solid var(--line);padding:10px 0}
.review-item summary{cursor:pointer;display:flex;gap:10px;align-items:baseline}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.dot.ok{background:var(--ok)}.dot.ko{background:var(--bad)}
.expl{font-size:.95rem;background:var(--paper);padding:12px 14px;border-radius:var(--r-s);margin-top:8px}
table.list{width:100%;border-collapse:collapse;font-size:.93rem}
table.list th,table.list td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.list th{color:var(--muted);font-weight:600}
.tag{font-size:.78rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--paper);border:1px solid var(--line);white-space:nowrap}
.tag.notion{background:#EEF1F8}.tag.temps{background:#FFF7DB}.tag.inattention{background:#FCEBEA}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0}
.form label{display:flex;flex-direction:column;gap:4px;font-size:.88rem;font-weight:600}
.form input{border:1.5px solid var(--line);border-radius:var(--r-s);padding:9px 10px;background:var(--white)}
.err{color:var(--bad);font-weight:600}
.chartbox{position:relative;height:300px}

/* ---------- Examen ---------- */
.exam-top{background:var(--ink);color:#fff}
.order-list{display:grid;gap:8px;margin:14px 0}
.order-list label{display:flex;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:var(--r-s);padding:10px 14px;cursor:pointer;background:var(--white)}
.order-list input{accent-color:var(--ink)}
.rv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;margin:16px 0}
.rv-grid button{border:1.5px solid var(--line);border-radius:var(--r-s);padding:10px 4px;background:var(--white);cursor:pointer;font-weight:700;position:relative}
.rv-grid button.mk{border-color:var(--signal);background:#FFF7DB}
.rv-grid button.na{border-style:dashed;color:var(--muted)}
.rv-grid button.ed::after{content:'';position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--q)}
.bookmark.on{background:var(--signal);color:var(--ink)}

/* ---------- Calculatrice ---------- */
.calc{position:fixed;right:20px;bottom:20px;width:230px;background:var(--ink);border-radius:var(--r-m);padding:12px;z-index:40;box-shadow:0 10px 30px rgba(23,32,54,.35)}
.calc-d{background:#fff;color:var(--ink);border-radius:var(--r-s);padding:8px 10px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums;min-height:2.2em;margin-bottom:8px;overflow-x:auto;white-space:nowrap}
.calc-k{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.calc-k button{border:0;border-radius:var(--r-s);padding:9px 0;background:var(--ink-2);color:#fff;font-weight:700;cursor:pointer}
.calc-k button.op{background:var(--ink-3)} .calc-k button.eq{background:var(--signal);color:var(--ink)}
.calc-h{display:flex;justify-content:space-between;color:#fff;font-weight:700;font-size:.9rem;margin-bottom:8px}
.calc-h button{background:none;border:0;color:#fff;cursor:pointer;font-size:1rem}

@media (max-width:640px){
  .wrap{padding:20px 14px 50px}.panel{padding:18px}.qbox{padding:18px}
  .bar-row{grid-template-columns:110px 1fr 44px}
  .nav button{padding:6px 9px;font-size:.9rem}
}

/* ---------- Ajustements après tests visuels ---------- */
.qbar .btn{background:var(--ink-2);border:1.5px solid var(--ink-3)}
.qbar .btn:hover{background:var(--ink-3)}
.qbar .btn.bookmark.on{background:var(--signal);color:var(--ink);border-color:var(--signal)}
.tabs button{font-family:var(--ui)}
.mtable td.c,.mtable th.c{width:auto;min-width:96px}
.qgrid:not(.split)>div{max-width:860px}

</style>
</head>
<body>
<header class="top"><div class="top-in">
  <button class="brand" data-act="nav" data-arg="home"><span class="brand-mark" aria-hidden="true"></span>GMAT Academy</button>
  <nav class="nav" id="nav" aria-label="Navigation principale"></nav>
</div></header>
<main id="app"></main>
<div id="calc"></div>
<script>
// ===== Banque de questions : QUANTITATIVE REASONING =====
// Format : M(id, thème, difficulté 1-3, énoncé HTML, options, index bonne réponse, explication FR)
function M(id, t, d, q, o, a, e) { return { id, t, d, k: 'mcq', q, o, a, e }; }

const QB_QUANT = [
// ---------- Arithmétique & propriétés des nombres ----------
M('a1','arith',1,`What is 15% of 40% of 500?`,[`20`,`25`,`30`,`35`,`60`],2,`40 % de 500 = 200, puis 15 % de 200 = 30. Astuce : 0,15 × 0,4 = 0,06 et 0,06 × 500 = 30.`),
M('a2','arith',1,`If <i>x</i> is an even integer and <i>y</i> is an odd integer, which of the following must be odd?`,[`<i>xy</i>`,`<i>x</i> + <i>y</i>`,`2<i>y</i>`,`<i>x</i><sup>2</sup>`,`<i>y</i> + 1`],1,`Pair + impair = impair. Les autres sont toujours pairs : un produit contenant un facteur pair est pair, et impair + 1 est pair.`),
M('a3','arith',2,`What is the remainder when 7<sup>23</sup> is divided by 5?`,[`0`,`1`,`2`,`3`,`4`],3,`7 ≡ 2 (mod 5). Les puissances de 2 modulo 5 suivent le cycle 2, 4, 3, 1 (période 4). 23 = 4×5 + 3, donc on prend le 3e terme du cycle : 3.`),
M('a4','arith',2,`How many positive divisors does 360 have?`,[`12`,`18`,`20`,`24`,`36`],3,`360 = 2³ × 3² × 5. Nombre de diviseurs = (3+1)(2+1)(1+1) = 24.`),
M('a5','arith',1,`The price of an item is increased by 20% and the new price is then decreased by 20%. What is the net percent change in the price?`,[`0%`,`4% decrease`,`4% increase`,`2% decrease`,`2% increase`],1,`On multiplie les coefficients : 1,2 × 0,8 = 0,96, soit une baisse de 4 %. Piège classique : les deux 20 % ne s'annulent pas car ils ne portent pas sur la même base.`),
M('a6','arith',2,`In a club, the ratio of boys to girls is 3 to 5. After 6 more boys join, the ratio becomes 1 to 1. How many girls are in the club?`,[`9`,`12`,`15`,`18`,`20`],2,`Garçons = 3k, filles = 5k. 3k + 6 = 5k donc k = 3 et il y a 15 filles.`),
M('a7','arith',1,`(0.25 × 0.4) ÷ 0.05 =`,[`0.2`,`2`,`20`,`0.02`,`5`],1,`0,25 × 0,4 = 0,1 et 0,1 ÷ 0,05 = 2.`),
M('a8','arith',3,`If <i>n</i> is a positive integer and <i>n</i><sup>2</sup> is divisible by 72, what is the largest positive integer that must divide <i>n</i>?`,[`6`,`12`,`24`,`36`,`72`],1,`72 = 2³ × 3². Dans n², chaque exposant est pair, donc n² doit contenir au moins 2⁴ × 3² : n contient au moins 2² × 3 = 12. Vérification : n = 12 donne n² = 144 = 2 × 72.`),
M('a9','arith',3,`How many zeros are at the end of 50! (the product of the integers from 1 to 50)?`,[`10`,`11`,`12`,`13`,`15`],2,`On compte les facteurs 5 : ⌊50/5⌋ + ⌊50/25⌋ = 10 + 2 = 12. Les facteurs 2 sont toujours plus nombreux.`),
M('a10','arith',2,`What is the least common multiple of 12, 18, and 30?`,[`60`,`90`,`180`,`360`,`540`],2,`12 = 2²×3, 18 = 2×3², 30 = 2×3×5. PPCM = 2² × 3² × 5 = 180.`),
M('a11','arith',2,`√50 + √18 =`,[`8√2`,`√68`,`2√17`,`15√2`,`6√2`],0,`√50 = 5√2 et √18 = 3√2, donc la somme vaut 8√2. On ne peut jamais additionner sous la racine : √a + √b ≠ √(a+b).`),
M('a12','arith',1,`Which of the following is greatest?`,[`3/5`,`5/8`,`7/11`,`2/3`,`9/14`],3,`En décimal : 0,600 ; 0,625 ; 0,636 ; 0,667 ; 0,643. La plus grande est 2/3.`),
M('a13','arith',3,`If <i>p</i> is a prime number greater than 3, what is the remainder when <i>p</i><sup>2</sup> is divided by 12?`,[`0`,`1`,`3`,`5`,`9`],1,`Tout premier > 3 s'écrit 6k ± 1, donc p² = 36k² ± 12k + 1 : le reste est toujours 1. Vérification rapide : 5² = 25 = 2×12 + 1 ; 7² = 49 = 4×12 + 1.`),
M('a14','arith',2,`2<sup>10</sup> + 2<sup>10</sup> + 2<sup>10</sup> + 2<sup>10</sup> =`,[`2<sup>40</sup>`,`8<sup>10</sup>`,`2<sup>12</sup>`,`4<sup>40</sup>`,`2<sup>14</sup>`],2,`4 × 2¹⁰ = 2² × 2¹⁰ = 2¹².`),
M('a15','arith',2,`What is the sum of all multiples of 3 between 1 and 100?`,[`1,584`,`1,617`,`1,650`,`1,683`,`1,700`],3,`3 + 6 + … + 99 = 3 × (1 + 2 + … + 33) = 3 × (33 × 34 / 2) = 3 × 561 = 1 683.`),
M('a16','arith',1,`If 3/4 of a number is 27, what is 2/3 of the number?`,[`18`,`20`,`24`,`27`,`30`],2,`Le nombre vaut 27 × 4/3 = 36, et 2/3 de 36 = 24.`),
M('a17','arith',3,`If <i>x</i> and <i>y</i> are positive integers such that 3<i>x</i> + 5<i>y</i> = 52, how many ordered pairs (<i>x</i>, <i>y</i>) are possible?`,[`2`,`3`,`4`,`5`,`6`],1,`52 − 5y doit être un multiple de 3 positif. y = 2 → x = 14 ; y = 5 → x = 9 ; y = 8 → x = 4 ; y = 11 rend 52 − 55 négatif. Il y a donc 3 couples.`),
M('a18','arith',1,`A stock price rose from $80 to $100. By what percent did it increase?`,[`15%`,`20%`,`25%`,`80%`,`125%`],2,`Hausse de 20 sur une base de 80 : 20/80 = 25 %. Piège : 20 % correspond à 20/100, calculé sur la mauvaise base.`),
M('a19','arith',2,`What is the units digit of 3<sup>47</sup>?`,[`1`,`3`,`5`,`7`,`9`],3,`Le chiffre des unités des puissances de 3 suit le cycle 3, 9, 7, 1. 47 = 4×11 + 3, donc 3e terme : 7.`),
M('a20','arith',3,`What is the greatest integer <i>n</i> such that 3<sup><i>n</i></sup> is a factor of 20! ?`,[`6`,`7`,`8`,`9`,`10`],2,`⌊20/3⌋ + ⌊20/9⌋ = 6 + 2 = 8. On compte une fois chaque multiple de 3, puis une fois de plus chaque multiple de 9.`),

// ---------- Algèbre ----------
M('g1','algebra',1,`If 3<i>x</i> − 7 = 11, what is the value of <i>x</i>?`,[`4`,`5`,`6`,`7`,`18/7`],2,`3x = 18 donc x = 6.`),
M('g2','algebra',1,`If <i>x</i> + <i>y</i> = 10 and <i>x</i> − <i>y</i> = 4, what is the value of <i>xy</i>?`,[`21`,`24`,`16`,`40`,`14`],0,`En additionnant : 2x = 14, donc x = 7 et y = 3. xy = 21.`),
M('g3','algebra',2,`Which of the following describes all values of <i>x</i> for which |2<i>x</i> − 3| &lt; 5?`,[`−1 &lt; <i>x</i> &lt; 4`,`<i>x</i> &lt; 4`,`−4 &lt; <i>x</i> &lt; 1`,`<i>x</i> &gt; −1`,`1 &lt; <i>x</i> &lt; 4`],0,`−5 < 2x − 3 < 5, donc −2 < 2x < 8, soit −1 < x < 4.`),
M('g4','algebra',2,`If <i>x</i><sup>2</sup> − 5<i>x</i> + 6 = 0, what is the sum of all possible values of 2<i>x</i>?`,[`5`,`6`,`10`,`12`,`−10`],2,`(x − 2)(x − 3) = 0, donc x = 2 ou 3, et 2x = 4 ou 6. Somme = 10.`),
M('g5','algebra',2,`If (<i>a</i> + <i>b</i>)<sup>2</sup> = 49 and <i>ab</i> = 6, what is the value of <i>a</i><sup>2</sup> + <i>b</i><sup>2</sup>?`,[`37`,`43`,`49`,`55`,`31`],0,`(a + b)² = a² + 2ab + b², donc a² + b² = 49 − 12 = 37. Inutile de trouver a et b.`),
M('g6','algebra',2,`If 4<sup><i>x</i></sup> = 8<sup><i>x</i> − 1</sup>, what is the value of <i>x</i>?`,[`1`,`2`,`3`,`4`,`6`],2,`Même base : 2^(2x) = 2^(3x − 3), donc 2x = 3x − 3 et x = 3.`),
M('g7','algebra',2,`If <i>f</i>(<i>x</i>) = <i>x</i><sup>2</sup> − 3<i>x</i>, what is the value of <i>f</i>(<i>f</i>(2))?`,[`−2`,`2`,`4`,`10`,`−10`],3,`f(2) = 4 − 6 = −2, puis f(−2) = 4 + 6 = 10.`),
M('g8','algebra',3,`If <i>x</i> &lt; 0, <i>x</i><sup>2</sup> = 16, and <i>y</i><sup>3</sup> = −27, what is the value of <i>x</i> − <i>y</i>?`,[`−7`,`−1`,`1`,`7`,`−12`],1,`x < 0 donc x = −4 ; y = −3 (racine cubique unique). x − y = −4 + 3 = −1.`),
M('g9','algebra',2,`For what value of <i>k</i> does the system 2<i>x</i> + 3<i>y</i> = 12 and 4<i>x</i> + 6<i>y</i> = <i>k</i> have infinitely many solutions?`,[`6`,`12`,`18`,`24`,`36`],3,`La 2e équation doit être exactement le double de la 1re : k = 24.`),
M('g10','algebra',2,`If 1/<i>x</i> + 1/<i>y</i> = 1/2 and <i>xy</i> = 20, what is the value of <i>x</i> + <i>y</i>?`,[`2`,`5`,`10`,`20`,`40`],2,`1/x + 1/y = (x + y)/xy, donc (x + y)/20 = 1/2 et x + y = 10.`),
M('g11','algebra',3,`How many integers <i>x</i> satisfy <i>x</i><sup>2</sup> &lt; 2<i>x</i> + 8?`,[`4`,`5`,`6`,`7`,`8`],1,`x² − 2x − 8 < 0 ⇔ (x − 4)(x + 2) < 0 ⇔ −2 < x < 4. Entiers : −1, 0, 1, 2, 3, soit 5.`),
M('g12','algebra',1,`If <i>a</i>/<i>b</i> = 3/4 and <i>b</i>/<i>c</i> = 2/5, what is <i>a</i>/<i>c</i>?`,[`3/10`,`6/5`,`15/8`,`8/15`,`1/2`],0,`a/c = (a/b) × (b/c) = 3/4 × 2/5 = 6/20 = 3/10.`),
M('g13','algebra',2,`If <i>x</i> = 2 + √3, what is the value of <i>x</i> + 1/<i>x</i>?`,[`4`,`2√3`,`4 + 2√3`,`2`,`3`],0,`1/(2 + √3) = (2 − √3)/(4 − 3) = 2 − √3. Donc x + 1/x = 4.`),
M('g14','algebra',3,`If <i>x</i> and <i>y</i> are positive integers, <i>x</i> &gt; 1, and <i>x</i><sup><i>y</i></sup> = 64, how many ordered pairs (<i>x</i>, <i>y</i>) are possible?`,[`2`,`3`,`4`,`5`,`6`],2,`64 = 2⁶ = 4³ = 8² = 64¹, soit 4 couples.`),
M('g15','algebra',2,`In an arithmetic sequence, the 1st term is 7 and the 10th term is 34. What is the 20th term?`,[`61`,`64`,`67`,`68`,`70`],1,`34 = 7 + 9d donc d = 3. 20e terme = 7 + 19 × 3 = 64.`),
M('g16','algebra',2,`If 3<sup><i>a</i></sup> × 9<sup><i>b</i></sup> = 3<sup>10</sup> and <i>a</i> − <i>b</i> = 1, what is <i>a</i> + <i>b</i>?`,[`5`,`6`,`7`,`8`,`9`],2,`3^(a + 2b) = 3¹⁰ donc a + 2b = 10. Avec a = b + 1 : 3b + 1 = 10, b = 3, a = 4, donc a + b = 7.`),
M('g17','algebra',3,`If <i>g</i>(<i>x</i>) = 2<i>x</i> + 1 and <i>h</i>(<i>x</i>) = <i>x</i><sup>2</sup>, for which values of <i>x</i> does <i>h</i>(<i>g</i>(<i>x</i>)) = <i>g</i>(<i>h</i>(<i>x</i>))?`,[`0 only`,`−2 only`,`0 and −2`,`0 and 2`,`No value`],2,`(2x + 1)² = 2x² + 1 ⇔ 4x² + 4x + 1 = 2x² + 1 ⇔ 2x(x + 2) = 0, donc x = 0 ou x = −2.`),
M('g18','algebra',1,`If 4(<i>x</i> − 3) = 2<i>x</i> + 6, what is the value of <i>x</i>?`,[`3`,`6`,`9`,`12`,`18`],2,`4x − 12 = 2x + 6, donc 2x = 18 et x = 9.`),

// ---------- Word problems, statistiques, combinatoire, probabilités ----------
M('w1','wp',1,`A car travels at 60 miles per hour for 2 hours and then at 90 miles per hour for 1 hour. What is its average speed for the whole trip, in miles per hour?`,[`70`,`72`,`75`,`65`,`80`],0,`Distance totale = 120 + 90 = 210 miles en 3 h, soit 70 mph. Piège : la moyenne des vitesses (75) ne tient pas compte des durées.`),
M('w2','wp',2,`Alice can complete a job in 6 hours and Ben can complete the same job in 3 hours. Working together at these rates, how many hours will they need?`,[`1.5`,`2`,`2.5`,`3`,`4.5`],1,`Taux combinés : 1/6 + 1/3 = 1/2 de travail par heure, donc 2 heures.`),
M('w3','wp',2,`How many liters of pure water must be added to 20 liters of a 30% acid solution to obtain a 20% acid solution?`,[`5`,`8`,`10`,`12`,`15`],2,`L'acide reste à 6 L. 6/(20 + w) = 0,2 donc 20 + w = 30 et w = 10.`),
M('w4','wp',2,`$2,000 is invested at 5% annual interest, compounded annually. How much interest is earned after 2 years?`,[`$200`,`$205`,`$210`,`$220`,`$2,205`],1,`2 000 × 1,05² = 2 205, soit 205 $ d'intérêts. Attention : 2 205 est le montant total, pas l'intérêt.`),
M('w5','wp',1,`The average of 5 numbers is 18. When one number is removed, the average of the remaining 4 numbers is 16. What number was removed?`,[`2`,`18`,`20`,`24`,`26`],4,`Somme initiale = 90, somme restante = 64, donc le nombre retiré vaut 26.`),
M('w6','wp',2,`The median of the set {2, 8, 5, 11, <i>x</i>} is 8. Which of the following could be the value of <i>x</i>?`,[`3`,`5`,`6`,`7`,`10`],4,`Avec 2, 5, 8, 11 et x, la médiane (3e valeur) vaut 8 seulement si x ≥ 8. Seul 10 convient.`),
M('w7','wp',2,`In how many ways can 5 people sit in a row of 5 chairs if two of them, Ana and Bo, must sit next to each other?`,[`24`,`48`,`60`,`96`,`120`],1,`On colle Ana et Bo en un bloc : 4 éléments à ranger, 4! = 24, multiplié par 2 ordres dans le bloc = 48.`),
M('w8','wp',2,`How many different 3-person committees can be formed from a group of 7 people?`,[`21`,`35`,`42`,`70`,`210`],1,`L'ordre n'a pas d'importance : C(7,3) = 7×6×5 / 3! = 35.`),
M('w9','wp',2,`Two fair six-sided dice are rolled. What is the probability that the sum is 7?`,[`1/12`,`1/9`,`1/6`,`7/36`,`1/4`],2,`6 combinaisons favorables (1-6, 2-5, 3-4, 4-3, 5-2, 6-1) sur 36, soit 1/6.`),
M('w10','wp',3,`A bag contains 4 red marbles and 6 blue marbles. Two marbles are drawn at random without replacement. What is the probability that both are red?`,[`1/15`,`2/15`,`4/25`,`1/5`,`2/9`],1,`4/10 × 3/9 = 12/90 = 2/15. Sans remise, le dénominateur diminue au 2e tirage.`),
M('w11','wp',2,`A fair coin is tossed 3 times. What is the probability of getting at least one head?`,[`1/8`,`3/8`,`1/2`,`3/4`,`7/8`],4,`P(au moins une face) = 1 − P(aucune) = 1 − (1/2)³ = 7/8.`),
M('w12','wp',2,`Which of the following sets has the greatest standard deviation?`,[`{10, 10, 10, 10, 10}`,`{1, 2, 3, 4, 5}`,`{10, 20, 30, 40, 50}`,`{100, 101, 102, 103, 104}`,`{5, 10, 15, 20, 25}`],2,`L'écart-type mesure la dispersion autour de la moyenne. Les valeurs de {10, …, 50} sont espacées de 10, plus que tous les autres ensembles. Ajouter 100 à chaque valeur (option D) ne change pas l'écart-type.`),
M('w13','wp',2,`A train 300 meters long passes a signal pole in 15 seconds. What is the speed of the train, in kilometers per hour?`,[`54`,`60`,`72`,`80`,`90`],2,`300/15 = 20 m/s. 20 × 3,6 = 72 km/h.`),
M('w14','wp',2,`A store marks up an item 40% above cost and then sells it at a 25% discount off the marked price. The store's profit is what percent of the cost?`,[`5%`,`10%`,`15%`,`−5%`,`0%`],0,`1,4 × 0,75 = 1,05 : le prix de vente est 105 % du coût, soit 5 % de profit.`),
M('w15','wp',3,`Pipe A can fill a tank in 4 hours and pipe B in 6 hours. A drain can empty the full tank in 12 hours. If all three are open, how many hours will it take to fill the empty tank?`,[`2`,`2.4`,`3`,`3.5`,`4`],2,`1/4 + 1/6 − 1/12 = 3/12 + 2/12 − 1/12 = 4/12 = 1/3 de réservoir par heure, donc 3 heures.`),
M('w16','wp',2,`Class A has 20 students with an average score of 70. Class B has 30 students with an average score of 80. What is the average score of all 50 students?`,[`74`,`75`,`76`,`77`,`78`],2,`(20×70 + 30×80)/50 = (1 400 + 2 400)/50 = 76. La moyenne se rapproche de la classe la plus nombreuse.`),
M('w17','wp',3,`How many different arrangements can be made using all the letters of the word LEVEL?`,[`20`,`24`,`30`,`60`,`120`],2,`5! / (2! × 2!) = 120/4 = 30, car L et E apparaissent deux fois chacun.`),
M('w18','wp',2,`A father is 3 times as old as his son. In 12 years, he will be twice as old as his son. How old is the son now?`,[`8`,`10`,`12`,`15`,`18`],2,`3s + 12 = 2(s + 12) donc s = 12.`),
M('w19','wp',1,`12 workers can build a wall in 10 days. Working at the same rate, how many days would 15 workers need?`,[`6`,`7.5`,`8`,`9`,`12`],2,`Travail total = 12 × 10 = 120 jours-ouvrier. 120/15 = 8 jours.`),
M('w20','wp',2,`The average of 7 consecutive integers is 20. What is the largest of these integers?`,[`21`,`22`,`23`,`24`,`26`],2,`Pour des entiers consécutifs, la moyenne est le terme du milieu (4e). Les termes vont de 17 à 23.`),
];

// ===== Banque de questions : VERBAL REASONING =====
const QB_CR = [
M('c1','cr',1,`Last year, the city of Harlow installed speed cameras on Main Street. Over the following twelve months, accidents on Main Street fell by 30 percent. The city council concluded that the cameras caused the decline.<br><br>Which of the following, if true, most seriously weakens the council's conclusion?`,[`Accidents also fell by about 30 percent last year on nearby streets that have no speed cameras.`,`Speed cameras are expensive to install and maintain.`,`Most drivers on Main Street are local residents.`,`The cameras were installed in March rather than January.`,`Some drivers say they dislike the cameras.`],0,`Si les accidents ont baissé autant là où il n'y a pas de caméras, une autre cause (météo, travaux, trafic…) explique sans doute la baisse : le lien causal est affaibli.`),
M('c2','cr',2,`A company found that employees who attended its optional time-management workshop completed 20 percent more projects on schedule than employees who did not attend. The company plans to make the workshop mandatory for all employees in order to improve on-time completion.<br><br>The plan assumes which of the following?`,[`The workshop is the least expensive training the company offers.`,`Employees who attended were not already more organized than those who did not attend.`,`All employees will enjoy the workshop.`,`Projects completed on schedule are of higher quality.`,`The company has no other training programs.`],1,`Négation : si les participants étaient déjà plus organisés (auto-sélection), l'atelier n'explique pas l'écart et le rendre obligatoire n'aurait pas l'effet attendu. C'est l'hypothèse nécessaire.`),
M('c3','cr',2,`Sales of electric bicycles in Rivertown doubled after the city built 40 kilometers of protected bike lanes. City planners argue that building more protected lanes will further increase e-bike sales.<br><br>Which of the following, if true, most strengthens the planners' argument?`,[`E-bikes are more expensive than ordinary bicycles.`,`Rivertown's population grew slightly over the same period.`,`In surveys, most new e-bike buyers in Rivertown said that the protected lanes were the main reason for their purchase.`,`Some residents oppose building more bike lanes.`,`Neighboring towns have fewer bike lanes than Rivertown.`],2,`Le témoignage direct des acheteurs confirme le lien de causalité entre les pistes protégées et les achats, ce qui renforce la prédiction.`),
M('c4','cr',2,`Over the past decade, the number of people visiting Lake Orin's public beaches has risen steadily, yet the revenue the town collects from beach parking fees has fallen.<br><br>Which of the following, if true, best explains this apparent discrepancy?`,[`The beaches have become more crowded on weekends.`,`The town raised the parking fee five years ago.`,`A new free shuttle bus now brings most visitors to the beaches from the town center.`,`The lake's water quality has improved.`,`Some visitors stay at the beach for several hours.`],2,`Paradoxe : plus de visiteurs mais moins de recettes de parking. Si la plupart viennent en navette gratuite, ils ne paient pas de stationnement : les deux faits deviennent compatibles.`),
M('c5','cr',1,`All of the restaurants on Elm Street that received a five-star rating this year use only locally sourced vegetables. Café Rosa, on Elm Street, uses only locally sourced vegetables.<br><br>Which of the following conclusions is most strongly supported by the statements above?`,[`Café Rosa received a five-star rating this year.`,`Using local vegetables guarantees a five-star rating.`,`No restaurant outside Elm Street received five stars.`,`If an Elm Street restaurant does not use only local vegetables, it did not receive a five-star rating this year.`,`Most restaurants on Elm Street use local vegetables.`],3,`« Cinq étoiles → légumes locaux » implique sa contraposée : « pas uniquement local → pas cinq étoiles ». L'option A inverse la condition (erreur logique classique).`),
M('c6','cr',3,`Software firm Kortex claims that its new spam filter blocks 99 percent of spam emails. Critics point out that the filter also blocks 10 percent of legitimate emails.<br><br>Which of the following would be most useful to know in evaluating whether the filter is beneficial for a typical user?`,[`How many employees Kortex has`,`Whether competing filters cost more`,`The proportion of a typical user's incoming email that is spam`,`How long Kortex took to develop the filter`,`Whether the filter works on mobile phones`],2,`Question Evaluate : l'intérêt du filtre dépend de la part de spam reçue. Si le spam est rare, bloquer 10 % des vrais e-mails coûte plus que ce que le filtre rapporte ; s'il est massif, le filtre est très utile.`),
M('c7','cr',2,`Politician: "Our state's unemployment rate fell from 8 percent to 5 percent during my term. Clearly, my job-training program put thousands of people back to work."<br><br>Which of the following, if true, most weakens the politician's argument?`,[`The job-training program cost less than expected.`,`During the same period, a large number of unemployed residents stopped looking for work and so were no longer counted as unemployed.`,`Some participants in the program found jobs in other states.`,`The politician's opponent proposed a different program.`,`Unemployment rates vary from state to state.`],1,`Le taux a pu baisser parce que des chômeurs ont quitté la population active, pas parce qu'ils ont retrouvé un emploi : autre explication de la baisse.`),
M('c8','cr',3,`<b>Most nutritionists agree that eating breakfast improves concentration.</b> However, a recent study found that students who skipped breakfast scored no worse on morning tests than those who ate breakfast. <b>The study's participants, though, were all accustomed to skipping breakfast.</b><br><br>In the argument above, the two portions in boldface play which of the following roles?`,[`The first is a position the argument opposes; the second supports that position.`,`The first is a widely held view that the study appears to challenge; the second suggests a limitation of the study.`,`The first is the argument's conclusion; the second is evidence for it.`,`Both are evidence supporting the study's findings.`,`The first is evidence; the second is the argument's main conclusion.`],1,`Le 1er passage est l'opinion répandue que l'étude semble contredire ; le 2e relativise l'étude (échantillon habitué à sauter le petit-déjeuner).`),
M('c9','cr',2,`To reduce traffic congestion downtown, the city of Norbury plans to raise downtown parking fees by 50 percent.<br><br>Which of the following, if true, most strongly suggests that the plan will fail to achieve its goal?`,[`Most downtown parking spaces are in private garages whose fees the city does not control.`,`Downtown businesses support the plan.`,`Parking fees in Norbury are lower than in nearby cities.`,`Many commuters own more than one car.`,`The city will use the extra revenue to repair roads.`],0,`Si la ville ne contrôle pas les tarifs de la plupart des places, la hausse ne touchera qu'une minorité de conducteurs : peu d'effet sur la congestion.`),
M('c10','cr',1,`Bakery owner: "Since we started offering free samples at the entrance, our weekly sales have increased by 15 percent. So the samples must be attracting customers who would not otherwise have bought anything."<br><br>The argument depends on which of the following assumptions?`,[`The free samples are expensive to produce.`,`Competitors do not offer free samples.`,`The increase in sales was not caused by some other change at the bakery made at the same time.`,`Customers prefer bread to pastries.`,`The samples are offered every day.`],2,`L'argument attribue la hausse aux échantillons : il suppose qu'aucun autre changement simultané (nouveau produit, promotion…) ne l'explique.`),
M('c11','cr',3,`In a survey of 2,000 subscribers to <i>Investor Weekly</i>, 70 percent said they expect stock prices to rise next year. The magazine concludes that most adults in the country are optimistic about the stock market.<br><br>Which of the following identifies the most serious flaw in the reasoning?`,[`It relies on a sample that is too small.`,`It assumes subscribers to an investment magazine are representative of all adults.`,`It confuses expectations with actual outcomes.`,`It ignores the 30 percent who were not optimistic.`,`It fails to define "stock prices."`],1,`Échantillon non représentatif : les abonnés d'un magazine d'investissement ne reflètent pas l'ensemble de la population adulte. 2 000 personnes suffisent souvent, à condition que l'échantillon soit représentatif.`),
M('c12','cr',2,`Since the national park doubled its entrance fee, the number of annual visitors has fallen by 10 percent. Nonetheless, park officials report that total entrance-fee revenue has increased.<br><br>Which of the following can most properly be inferred from the information above?`,[`The park should raise its fee again.`,`Visitors who stopped coming were mostly local residents.`,`The average entrance-fee revenue collected per visitor is higher than it was before the increase.`,`The park's operating costs have increased.`,`Most visitors consider the new fee reasonable.`],2,`Le tarif ayant doublé pour chaque visiteur, la recette moyenne par visiteur est forcément plus élevée. Les autres options (relever encore le tarif, profil des visiteurs perdus, coûts, opinion) ne découlent pas des faits donnés.`),
M('c13','cr',2,`Hospitals that adopted electronic patient records reported fewer medication errors than hospitals that kept paper records. A health agency therefore recommends that all hospitals adopt electronic records to reduce medication errors.<br><br>Which of the following, if true, most strengthens the recommendation?`,[`Electronic record systems are expensive.`,`Some doctors prefer paper records.`,`Within individual hospitals, medication errors decreased significantly after electronic records were introduced.`,`Paper records are easier to store for long periods.`,`Larger hospitals are more likely to adopt new technology.`],2,`La comparaison avant/après dans un même hôpital élimine l'idée que les hôpitaux « électroniques » étaient différents dès le départ : le lien causal est renforcé.`),
M('c14','cr',3,`Researcher: "Cities with more public libraries per resident have higher literacy rates. Therefore, building more libraries will raise literacy rates."<br><br>Which of the following, if true, most seriously weakens the researcher's argument?`,[`Libraries also offer internet access.`,`Cities with higher literacy rates tend to vote to fund more libraries.`,`Some residents never use libraries.`,`Literacy rates have risen nationally over the past decade.`,`Library construction costs vary by city.`],1,`Causalité inversée : c'est peut-être l'alphabétisation élevée qui entraîne la création de bibliothèques, et non l'inverse.`),
M('c15','cr',2,`Each year, Vanta Corp. produces exactly as many units of its X200 printer as it sells. This year, the company's total production cost for the X200 rose by 12 percent, while the number of X200 units sold stayed the same.<br><br>Which of the following must be true?`,[`The average production cost per X200 unit rose this year.`,`Vanta's profit on the X200 fell this year.`,`Vanta raised the price of the X200 this year.`,`Demand for printers is declining.`,`Vanta's other products also became more expensive to produce.`],0,`Même nombre d'unités et coût total en hausse de 12 % : le coût moyen par unité augmente forcément. Le profit, lui, dépend aussi du prix, qui n'est pas donné.`),
M('c16','cr',1,`Mayor: "We should build a new stadium. It will create jobs during construction and attract tourists afterward, which will help local businesses."<br><br>Which of the following, if true, most weakens the mayor's argument?`,[`Several other cities have built stadiums.`,`Studies of similar cities found that money spent at new stadiums mostly came from local residents who reduced their spending at other local businesses.`,`The stadium will have a modern design.`,`Construction will take three years.`,`Some residents enjoy watching sports.`],1,`Si les dépenses au stade ne font que déplacer celles des habitants, il n'y a pas de gain net pour les commerces locaux : l'argument perd sa force.`),
M('c17','cr',3,`Archaeologists found pottery fragments from the island of Kala at an ancient site on the mainland. They concluded that the mainland settlement traded with Kala.<br><br>Which of the following would be most useful to evaluate this conclusion?`,[`Whether the fragments are older than the mainland settlement itself`,`How many archaeologists worked at the site`,`Whether Kala pottery was decorated`,`What the mainland settlers ate`,`How far modern ships travel`],0,`Si les fragments sont antérieurs à l'établissement, ils ont pu arriver par d'autres voies (migrants plus anciens, par exemple) : la réponse fait varier la solidité de la conclusion sur le commerce.`),
M('c18','cr',2,`Organic farms in Region Z use no synthetic pesticides, yet their average crop losses to insects are lower than those of conventional farms in the region.<br><br>Which of the following, if true, most helps to explain this finding?`,[`Organic produce sells at higher prices.`,`Organic farms in Region Z typically grow crops that are naturally resistant to the insects common in the region.`,`Conventional farms are larger on average.`,`Synthetic pesticides are expensive.`,`Some conventional farms are converting to organic methods.`],1,`Si les fermes bio cultivent des espèces naturellement résistantes, elles subissent moins de pertes même sans pesticides : le paradoxe est résolu.`),

const PASSAGES = {
p1: { title:`Default options and saving`, text:`<p>For decades, economists assumed that workers chose how much to save for retirement by weighing their future needs against present consumption. If many workers saved too little, the standard explanation was that they simply preferred to spend now. Beginning in the late 1990s, however, studies of employer-sponsored savings plans challenged this view.</p><p>In several firms, enrollment in the retirement plan had been voluntary: new employees had to fill out a form to join. When these firms switched to automatic enrollment, in which employees were enrolled unless they filled out a form to leave, participation among new hires rose from under 50 percent to more than 85 percent. Since the plan's financial terms were unchanged, the shift could hardly be explained by a change in workers' underlying preferences.</p><p>Behavioral economists attribute the effect partly to inertia and partly to the implicit endorsement that a default seems to carry. Yet the same studies revealed a cost: most automatically enrolled workers kept the low default contribution rate, even those who, under the old system, would have chosen to save more. A well-meant default can therefore anchor savers at a level below what they would otherwise have selected.</p>`},
p2: { title:`Coral bleaching`, text:`<p>Reef-building corals depend on microscopic algae that live inside their tissues. The algae supply most of the coral's energy through photosynthesis, and in return they receive shelter and nutrients. When water temperatures rise even 1 to 2 degrees Celsius above the usual summer maximum, this partnership breaks down: the algae produce harmful compounds, and the coral expels them. Without its algae, the coral turns white, a process known as bleaching, and may starve if conditions do not improve.</p><p>Not all corals bleach equally, however. Researchers have found that some colonies host strains of algae that tolerate heat better than others. Corals in naturally warm lagoons, for example, often carry these hardier strains and survive temperatures that kill corals elsewhere. This finding has raised hopes that reefs might adapt as oceans warm.</p><p>Such hopes should be tempered. Heat-tolerant algae typically provide the coral with less energy, so corals that host them tend to grow more slowly. Moreover, ocean temperatures are rising faster than most coral populations have ever had to adjust to. Adaptation may help some reefs, but it is unlikely to protect them all.</p>`},
p3: { title:`The shipping container`, text:`<p>Before the 1960s, loading a cargo ship was slow, labor-intensive work. Goods arrived at the docks in sacks, barrels, and crates of every size, and teams of dockworkers moved them one by one into the ship's hold. A vessel might spend as much time in port as at sea, and theft and breakage were common.</p><p>The standardized steel container changed this. Because containers came in uniform sizes, cranes could lift them directly from trucks or trains onto ships, and port time fell from days to hours. The cost of loading cargo dropped dramatically, and shippers could send goods across oceans with far greater predictability.</p><p>Historians caution, though, that the container's influence did not come from the box alone. Its benefits depended on agreements among shipping lines, ports, and governments to adopt common dimensions, as well as on enormous investments in new cranes and port facilities. Ports that could not afford these investments, or that resisted them, often lost traffic to rivals. The container thus reshaped not only how goods moved but also which cities prospered from moving them.</p>`},
p4: { title:`Remote work and innovation`, text:`<p>The rapid shift to remote work has prompted debate about its effect on innovation. Supporters point out that remote employees often report higher productivity on individual tasks, since they face fewer interruptions. Skeptics respond that innovation depends less on individual focus than on the exchange of ideas among people who would not otherwise interact.</p><p>A study of communication patterns at a large technology firm offers some support for the skeptics. After the firm moved to fully remote work, employees continued to communicate frequently with close colleagues, but their contact with people in other groups, so-called weak ties, declined sharply. Because weak ties are a primary channel through which new information enters a team, the researchers warned that remote work could slow the spread of ideas across an organization.</p><p>The study's authors acknowledge its limits. It examined only one firm, during a period when remote work was imposed suddenly rather than planned. Organizations that deliberately create opportunities for cross-group contact, such as periodic in-person gatherings, may be able to preserve the benefits of weak ties while keeping the advantages of remote work.</p>`},
};
function R(id, p, d, q, o, a, e) { return { id, t: 'rc', p, d, k: 'mcq', q, o, a, e }; }

// ---------- Graphiques SVG (Graphics Interpretation) ----------
function barChartSVG(title, labels, values, unit, max) {
  const W = 520, H = 280, L = 52, B = 40, T = 34, R = 16;
  const ch = H - B - T, cw = W - L - R, bw = cw / labels.length;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${title}"><text x="${L}" y="20" class="ct">${title}</text>`;
  for (let g = 0; g <= max; g += max / 4) {
    const y = T + ch - (g / max) * ch;
    s += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" class="cg"/><text x="${L - 8}" y="${y + 4}" class="cl" text-anchor="end">${g}</text>`;
  }
  labels.forEach((lb, i) => {
    const h = (values[i] / max) * ch, x = L + i * bw + bw * 0.2;
    s += `<rect x="${x}" y="${T + ch - h}" width="${bw * 0.6}" height="${h}" class="cb"/><text x="${x + bw * 0.3}" y="${T + ch - h - 6}" class="cv" text-anchor="middle">${values[i]}</text><text x="${x + bw * 0.3}" y="${H - 18}" class="cl" text-anchor="middle">${lb}</text>`;
  });
  return s + `<text x="${L}" y="${H - 2}" class="cl">${unit}</text></svg>`;
}
function lineChartSVG(title, labels, values, unit, min, max) {
  const W = 520, H = 280, L = 52, B = 40, T = 34, R = 24;
  const ch = H - B - T, cw = W - L - R, step = cw / (labels.length - 1);
  const yv = v => T + ch - ((v - min) / (max - min)) * ch;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${title}"><text x="${L}" y="20" class="ct">${title}</text>`;
  for (let g = min; g <= max; g += (max - min) / 4) {
    s += `<line x1="${L}" x2="${W - R}" y1="${yv(g)}" y2="${yv(g)}" class="cg"/><text x="${L - 8}" y="${yv(g) + 4}" class="cl" text-anchor="end">${g}</text>`;
  }
  s += `<polyline class="cline" points="${values.map((v, i) => `${L + i * step},${yv(v)}`).join(' ')}"/>`;
  labels.forEach((lb, i) => {
    s += `<circle cx="${L + i * step}" cy="${yv(values[i])}" r="4" class="cdot"/><text x="${L + i * step}" y="${yv(values[i]) - 10}" class="cv" text-anchor="middle">${values[i]}</text><text x="${L + i * step}" y="${H - 18}" class="cl" text-anchor="middle">${lb}</text>`;
  });
  return s + `<text x="${L}" y="${H - 2}" class="cl">${unit}</text></svg>`;
}

const $ = s => document.querySelector(s);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmt = s => { s = Math.max(0, Math.round(s)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
const pct = (c, n) => n ? Math.round(100 * c / n) : 0;
const strip = h => h.replace(/<[^>]+>/g, ' ').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&').replace(/\s+/g, ' ').trim();
const dateFR = ts => new Date(ts).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' });
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function isAnswered(q, a) {
  if (q.k === 'multi') return Array.isArray(a) && q.items.every((_, i) => a[i] != null);
  return a != null;
}
function isCorrect(q, a) {
  if (!isAnswered(q, a)) return false;
  if (q.k === 'multi') return q.items.every((it, i) => a[i] === it.a);
  return a === q.a;
}
function errType(q, secs, answered) {
  if (!answered || secs > 150) return 'temps';
  if (q.d === 1) return 'inattention';
  return 'notion';
}
const ERR_LABEL = { notion: 'Notion non maîtrisée', temps: 'Question trop longue', inattention: 'Erreur sur question facile' };

function recordAnswer(q, a, secs, mode) {
  const c = isCorrect(q, a);
  DB.answers.push({ id: q.id, t: q.t, c, s: Math.round(secs), m: mode, at: Date.now() });
  DB.seen[q.id] = (DB.seen[q.id] || 0) + 1;
  const e = DB.errors[q.id];
  if (!c) DB.errors[q.id] = { n: (e ? e.n : 0) + 1, last: Date.now(), type: errType(q, secs, isAnswered(q, a)), resolved: false };
  else if (e && mode === 'errors') e.resolved = true;
  return c;
}

// Sélection : les questions les moins vues d'abord, puis regroupement par passage / MSR
function leastSeen(pool, n) {
  return shuffle(pool).sort((a, b) => (DB.seen[a.id] || 0) - (DB.seen[b.id] || 0)).slice(0, n);
}
function groupOrder(list) {
  const key = q => q.p || q.grp || q.id, order = [], groups = {};
  list.forEach(q => { const k = key(q); if (!groups[k]) { groups[k] = []; order.push(k); } groups[k].push(q); });
  return order.flatMap(k => groups[k]);
}

function circuitSVG(cols) {
  const W = cols === 4 ? 1000 : 520, rowH = cols === 4 ? 170 : 150, marg = cols === 4 ? 140 : 120, ext = cols === 4 ? 20 : 10, R = rowH / 2;
  const top = 78, left = marg, right = W - marg, colW = (right - left) / (cols - 1), rows = Math.ceil(STEPS.length / cols);
  const H = top + (rows - 1) * rowH + 90;
  const pos = STEPS.map((_, i) => { const r = Math.floor(i / cols), c = i % cols; return { x: r % 2 === 0 ? left + c * colW : right - c * colW, y: top + r * rowH }; });
  let d = `M 30 ${top}`;
  for (let r = 0; r < rows; r++) {
    const y = top + r * rowH, even = r % 2 === 0, last = r === rows - 1;
    const ex = last ? (even ? W - 30 : 30) : (even ? right + ext : left - ext);
    d += ` L ${ex} ${y}`;
    if (!last) d += ` A ${R} ${R} 0 0 ${even ? 1 : 0} ${ex} ${y + rowH}`;
  }
  const lastRow = rows - 1, finX = lastRow % 2 === 0 ? W - 30 : 30, finY = top + lastRow * rowH;
  const prio = priorityThemes(), sel = ui.step, colors = { Q: 'var(--q)', V: 'var(--v)', DI: 'var(--di)' };
  let s = `<svg class="circuit" viewBox="0 0 ${W} ${H}" role="group" aria-label="Parcours en 12 étapes">
  <path d="${d}" fill="none" stroke="#3A4670" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="${d}" fill="none" stroke="#2A3455" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="${d}" fill="none" stroke="var(--signal)" stroke-width="2.5" stroke-dasharray="14 12" opacity=".75"/>`;
  // Drapeau de départ
  s += `<g transform="translate(30 ${top - 58})"><line x1="0" y1="0" x2="0" y2="40" stroke="#fff" stroke-width="2.5"/>`;
  for (let i = 0; i < 4; i++) for (let j = 0; j < 3; j++) s += `<rect x="${2 + i * 7}" y="${j * 7}" width="7" height="7" fill="${(i + j) % 2 ? '#172036' : '#fff'}"/>`;
  s += `<text x="34" y="16" fill="#fff" font-weight="800" font-size="14" font-family="var(--ui)">START</text></g>`;
  // Trophée
  s += `<g transform="translate(${finX} ${finY - 52})"><path d="M-15,-14 h30 v8 a15 15 0 0 1 -30 0 z" fill="var(--signal)"/><path d="M-15,-10 h-7 a7 7 0 0 0 7 9 M15,-10 h7 a7 7 0 0 1 -7 9" fill="none" stroke="var(--signal)" stroke-width="2.5"/><rect x="-3" y="9" width="6" height="8" fill="var(--signal)"/><rect x="-11" y="17" width="22" height="5" rx="1" fill="var(--signal)"/></g>`;
  STEPS.forEach((st, i) => {
    const { x, y } = pos[i], ss = stepState(st), isExam = st.kind === 'exam';
    const fill = isExam ? 'var(--signal)' : colors[THEMES[st.theme].sec], tc = isExam ? '#172036' : '#fff';
    const isPrio = !isExam && prio.includes(st.theme), r = cols === 4 ? 24 : 22;
    s += `<g class="node" data-act="step" data-arg="${st.n}" tabindex="0" role="button" aria-label="Étape ${st.n} : ${st.title}${ss.done ? ', terminée' : ''}">`;
    if (sel === st.n) s += `<circle cx="${x}" cy="${y}" r="${r + 9}" fill="none" stroke="#fff" stroke-width="2.5"/>`;
    s += `<circle class="ring" cx="${x}" cy="${y}" r="${r}" fill="${fill}" stroke="#172036" stroke-width="3"/>
      <text x="${x}" y="${y + 6}" text-anchor="middle" font-weight="800" font-size="17" fill="${tc}" font-family="var(--ui)">${st.n}</text>`;
    if (ss.done) s += `<circle cx="${x + r - 2}" cy="${y - r + 2}" r="9" fill="var(--ok)" stroke="#172036" stroke-width="2"/><path d="M${x + r - 6} ${y - r + 2} l3 3 l5 -6" fill="none" stroke="#fff" stroke-width="2.2"/>`;
    if (isPrio) s += `<circle cx="${x - r + 2}" cy="${y - r + 2}" r="9" fill="var(--bad)" stroke="#172036" stroke-width="2"/><text x="${x - r + 2}" y="${y - r + 7}" text-anchor="middle" font-weight="800" font-size="13" fill="#fff">!</text>`;
    st.label.forEach((ln, k) => { s += `<text x="${x}" y="${y + r + 22 + k * 17}" text-anchor="middle" font-size="15" font-weight="600" fill="#E3E8F2" font-family="var(--ui)">${ln}</text>`; });
    s += `</g>`;
  });
  return s + `</svg>`;
}

function questionHTML(q, a, o = {}) {

}

const ORDERS = [['Q', 'V', 'DI'], ['Q', 'DI', 'V'], ['V', 'Q', 'DI'], ['V', 'DI', 'Q'], ['DI', 'Q', 'V'], ['DI', 'V', 'Q']];
function buildSection(sec) {
  let list;
  if (sec === 'Q') list = shuffle(['arith', 'algebra', 'wp'].flatMap(t => leastSeen(ALL_Q.filter(q => q.t === t), 7)));
  else if (sec === 'V') {
    const used = p => QB_RC.filter(q => q.p === p).reduce((s, q) => s + (DB.seen[q.id] || 0), 0);
    const ps = shuffle(Object.keys(PASSAGES)).sort((a, b) => used(a) - used(b)).slice(0, 2);
    const cr = shuffle(leastSeen(QB_CR, 15));
    list = [...cr.slice(0, 4), ...QB_RC.filter(q => q.p === ps[0]), ...cr.slice(4, 11), ...QB_RC.filter(q => q.p === ps[1]), ...cr.slice(11)];
  } else {
    const ds = leastSeen(QB_DS, 10), msr = QB_DI.filter(q => q.grp), others = leastSeen(QB_DI.filter(q => !q.grp), 7);
    const singles = shuffle([...ds, ...others]);
    list = [...singles.slice(0, 11), ...msr, ...singles.slice(11)];
  }
  return { sec, qids: list.map(q => q.id), ans: list.map(() => null), times: list.map(() => 0), marks: [], edited: [], remaining: SEC_TIME, done: false };
}

function sectionScore(S) {
  let w = 0, got = 0;
  S.qids.forEach((id, i) => { const q = QMAP[id]; w += q.d; if (isCorrect(q, S.ans[i])) got += q.d; });

}

  let fs = [];
  R.sections.forEach(S => {

    scores[S.sec] = Math.min(90, Math.max(60, 60 + Math.round(30 * f)));

    S.qids.forEach((id, i) => {

      const ta = themeAcc[q.t] = themeAcc[q.t] || { c: 0, n: 0 }; ta.n++; if (c) ta.c++;
      if (!c) errTypes[errType(q, S.times[i], isAnswered(q, a))]++;

  if (!window.Chart) { document.querySelectorAll('.chartbox').forEach(b => b.innerHTML = '<p class="muted">Graphique indisponible : la bibliothèque Chart.js ne s\'est pas chargée.</p>'); return; }
  Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
  const pts = [...DB.exams.map(e => ({ d: new Date(e.date).toISOString().slice(0, 10), app: e.scores.total })), ...DB.official.map(o => ({ d: o.date, off: o.total }))].sort((a, b) => a.d.localeCompare(b.d));
  charts.push(new Chart($('#chScore'), { type: 'line', data: { labels: pts.map(p => new Date(p.d).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' })), datasets: [
    { label: 'Examen blanc (estimé)', data: pts.map(p => p.app ?? null), borderColor: '#172036', backgroundColor: '#F2B705', pointRadius: 6, spanGaps: true },
    { label: 'Score officiel mba.com', data: pts.map(p => p.off ?? null), borderColor: '#0F9B8E', backgroundColor: '#0F9B8E', pointStyle: 'rectRot', pointRadius: 8, spanGaps: true, borderDash: [6, 4] }] },
    options: { maintainAspectRatio: false, scales: { y: { min: 205, max: 805 } } } }));
  const ths = Object.keys(THEMES), col = { Q: '#2F6FED', V: '#7C4DDB', DI: '#0F9B8E' };
  charts.push(new Chart($('#chTheme'), { type: 'bar', data: { labels: ths.map(t => THEMES[t].name), datasets: [{ label: 'Réussite (%)', data: ths.map(t => { const a = DB.answers.filter(x => x.t === t); return a.length ? pct(a.filter(x => x.c).length, a.length) : 0; }), backgroundColor: ths.map(t => col[THEMES[t].sec]) }] },
    options: { maintainAspectRatio: false, indexAxis: 'y', scales: { x: { min: 0, max: 100 } }, plugins: { legend: { display: false } } } }));
  const secs = ['Q', 'V', 'DI'];
  charts.push(new Chart($('#chTime'), { type: 'bar', data: { labels: secs.map(s => SECTIONS[s].name), datasets: [
    { label: 'Votre moyenne (s)', data: secs.map(s => { const a = DB.answers.filter(x => THEMES[x.t].sec === s && x.s > 0); return a.length ? Math.round(a.reduce((m, x) => m + x.s, 0) / a.length) : 0; }), backgroundColor: '#172036' },
    { label: 'Rythme cible (s)', data: secs.map(s => TARGET_SEC[s]), backgroundColor: '#F2B705' }] }, options: { maintainAspectRatio: false } }));
}

// ===================== SCORES OFFICIELS =====================
function viewOfficial() {
  const list = DB.official.slice().sort((a, b) => b.date.localeCompare(a.date));
  return `<div class="wrap"><h1>Scores officiels</h1><p class="lead muted">mba.com ne permet pas de récupérer les résultats automatiquement. Après chaque Official Practice Exam, recopiez ici les scores affichés : ils apparaîtront dans la progression à côté des examens blancs de l'application.</p>
  <a class="btn ghost sm" href="${MBA_URL}" target="_blank" rel="noopener">Ouvrir mba.com</a>
  <div class="card"><h3>Ajouter un score</h3><div class="form">
    <label>Date<input type="date" id="o_date" value="${new Date().toISOString().slice(0, 10)}"></label>
    <label>Score total (205 à 805)<input type="number" id="o_total" min="205" max="805" step="10" placeholder="ex. 615"></label>
    <label>Quant (60 à 90)<input type="number" id="o_Q" min="60" max="90"></label>
    <label>Verbal (60 à 90)<input type="number" id="o_V" min="60" max="90"></label>
    <label>Data Insights (60 à 90)<input type="number" id="o_DI" min="60" max="90"></label>
    <label>Percentile (facultatif)<input type="number" id="o_pct" min="0" max="100"></label>
    <label>Examen<input type="text" id="o_note" placeholder="ex. Official Practice Exam 1"></label></div>
    ${ui.msg ? `<p class="err">${ui.msg}</p>` : ''}<button class="btn sig" data-act="addOfficial">Enregistrer le score</button></div>
  <div class="card"><h3>Historique</h3>${list.length ? `<table class="list"><thead><tr><th>Date</th><th>Total</th><th>Quant</th><th>Verbal</th><th>DI</th><th>Percentile</th><th>Examen</th><th></th></tr></thead><tbody>${list.map(o => `<tr><td>${dateFR(o.date)}</td><td><b>${o.total}</b></td><td>${o.Q}</td><td>${o.V}</td><td>${o.DI}</td><td>${o.pct ?? '-'}</td><td>${esc(o.note || '')}</td><td><button class="btn ghost sm" data-act="delOfficial" data-arg="${o.id}">Supprimer</button></td></tr>`).join('')}</tbody></table>` : `<p class="muted">Aucun score officiel enregistré.</p>`}</div></div>`;
}
function addOfficial() {
  const v = id => $('#' + id).value.trim(), num = id => v(id) === '' ? null : +v(id);
  const o = { id: 'of' + Date.now(), date: v('o_date'), total: num('o_total'), Q: num('o_Q'), V: num('o_V'), DI: num('o_DI'), pct: num('o_pct'), note: v('o_note') };
  if (!o.date) return go('official', { msg: 'Indiquez la date de l’examen.' });
  if (o.total == null || o.total < 205 || o.total > 805 || (o.total - 205) % 10 !== 0) return go('official', { msg: 'Le score total doit être compris entre 205 et 805 et se terminer par 5 (ex. 615).' });
  for (const s of ['Q', 'V', 'DI']) if (o[s] == null || o[s] < 60 || o[s] > 90 || !Number.isInteger(o[s])) return go('official', { msg: `Le score ${SECTIONS[s].name} doit être un entier entre 60 et 90.` });
  DB.official.push(o); save(); go('official');
}

// ===================== CALCULATRICE (Data Insights) =====================
function calcHTML() {
  const keys = ['7', '8', '9', '÷', '4', '5', '6', '×', '1', '2', '3', '−', '0', '.', '%', '+', 'C', '√', '(', ')'];
  return `<div class="calc" role="dialog" aria-label="Calculatrice"><div class="calc-h"><span>Calculatrice</span><button data-act="calc" aria-label="Fermer">✕</button></div><div class="calc-d" id="calcD">${esc(ui.calcVal || '0')}</div>
  <div class="calc-k">${keys.map(k => `<button class="${'÷×−+%√()'.includes(k) ? 'op' : ''}" data-act="ck" data-arg="${k}">${k}</button>`).join('')}<button class="eq" style="grid-column:span 4" data-act="ck" data-arg="=">=</button></div></div>`;
}
function calcKey(k) {
  let v = ui.calcVal || '';
  if (k === 'C') v = '';
  else if (k === '=' || k === '√' || k === '%') {
    try {
      const expr = v.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-');
      if (!/^[0-9+\-*/(). ]*$/.test(expr) || !expr) throw 0;
      let r = Function('"use strict";return (' + expr + ')')();
      if (k === '√') r = Math.sqrt(r); if (k === '%') r = r / 100;
      v = Number.isFinite(r) ? String(+r.toPrecision(12)) : 'Erreur';
    } catch (e) { v = 'Erreur'; }
  } else v = (v === 'Erreur' ? '' : v) + k;
  ui.calcVal = v; const d = $('#calcD'); if (d) d.textContent = v || '0';
}

// ===================== CHRONOMÈTRE =====================
setInterval(() => {
  const t = $('#timer');
  if (ui.view === 'practice' && ui.pr && ui.pr.limit) {
    ui.pr.remaining--; if (t) { t.textContent = fmt(ui.pr.remaining); t.classList.toggle('low', ui.pr.remaining < 60); }
    if (ui.pr.remaining <= 0) finishPractice(true);
  }
  const R = DB.examRun;
  if (ui.view === 'exam' && R) {
    if (R.phase === 'break') { R.breakRemaining--; if (t) t.textContent = fmt(R.breakRemaining); if (R.breakRemaining <= 0) endBreak(); }
    else if (R.phase === 'q' || R.phase === 'review' || R.phase === 'edit') {
      const S = R.sections[R.cur]; S.remaining--;
      if (t) { t.textContent = fmt(S.remaining); t.classList.toggle('low', S.remaining < 300); }
      if (S.remaining % 5 === 0) save();
      if (S.remaining <= 0) { if (R.phase === 'edit') rvBack(); endSection(); }
    }
  }
}, 1000);
function endBreak() { const R = DB.examRun; R.breakTaken = true; R.phase = 'q'; enterExamQ(); save(); render(); }

// ===================== ÉVÉNEMENTS =====================
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const a = el.dataset.act, arg = el.dataset.arg;
  switch (a) {
    case 'nav': if (arg === 'home') ui.step = ui.step || null; go(arg); break;
    case 'home': go('home'); break;
    case 'step': ui.step = +arg; go('home'); break;
    case 'cards': ui.step = +arg; ui.flipped = new Set(); go('cards'); break;
    case 'flip': {
      el.classList.toggle('flip'); el.classList.add('seen'); ui.flipped.add(+arg);
      const st = STEPS[ui.step - 1], tot = CARDS[st.theme].length;
      if (ui.flipped.size === tot) { (DB.steps[st.n] = DB.steps[st.n] || {}).cards = true; save(); }
      const p = el.closest('.wrap').querySelector('p.muted:last-child'); if (p) p.textContent = `${ui.flipped.size} carte${ui.flipped.size > 1 ? 's' : ''} retournée${ui.flipped.size > 1 ? 's' : ''} sur ${tot}${ui.flipped.size === tot ? ' : fiches marquées comme lues.' : ''}`;
      break; }
    case 'practice': startPractice(arg); break;
    case 'pick': setPick(arg, false); break;
    case 'pickm': setPick(arg, true); break;
    case 'tab': ui.tab = +arg; { const q = QMAP[ui.cur.qid]; const s = document.querySelector('.stim'); if (s) s.outerHTML = stimHTML(q); } break;
    case 'prValidate': prValidate(); break;
    case 'prNext': prNext(); break;
    case 'quitPractice': if (confirm('Quitter cet entraînement ? Les réponses déjà validées restent enregistrées.')) go(ui.pr.mode === 'errors' ? 'errors' : 'home'); break;
    case 'calc': ui.calc = !ui.calc; $('#calc').innerHTML = ui.calc ? calcHTML() : ''; break;
    case 'ck': calcKey(arg); break;
    case 'examSetup': ui.setupStep = +arg; go('exam'); break;
    case 'examStart': examStart(+arg); break;
    case 'resumeExam': { const R = DB.examRun; if (R.phase === 'q' || R.phase === 'edit') enterExamQ(); go('exam'); break; }
    case 'pauseExam': { const R = DB.examRun; if (R.phase === 'q' || R.phase === 'edit') { R.sections[R.cur].times[R.qi] += (Date.now() - ui.qStart) / 1000; if (R.phase === 'q') R.sections[R.cur].ans[R.qi] = ui.cur.a; } save(); ui.step = R.step; go('home'); break; }
    case 'mark': { const S = DB.examRun.sections[DB.examRun.cur], i = DB.examRun.qi, k = S.marks.indexOf(i); if (k < 0) S.marks.push(i); else S.marks.splice(k, 1); el.classList.toggle('on'); el.textContent = k < 0 ? 'Marquée' : 'Marquer'; save(); break; }
    case 'exValidate': exValidate(); break;
    case 'rvOpen': rvOpen(arg); break;
    case 'rvBack': rvBack(); break;
    case 'endSection': if (confirm('Terminer la section ? Vous ne pourrez plus revenir sur ces questions.')) endSection(); break;
    case 'takeBreak': DB.examRun.phase = 'break'; DB.examRun.breakRemaining = BREAK_TIME; save(); render(); break;
    case 'skipBreak': DB.examRun.phase = 'q'; enterExamQ(); save(); render(); break;
    case 'endBreak': endBreak(); break;
    case 'showExam': go('examResult', { result: arg }); break;
    case 'addOfficial': addOfficial(); break;
    case 'delOfficial': if (confirm('Supprimer ce score ?')) { DB.official = DB.official.filter(o => o.id !== arg); save(); go('official'); } break;
    case 'export': {
      const blob = new Blob([JSON.stringify(DB, null, 2)], { type: 'application/json' }), url = URL.createObjectURL(blob);
      const link = document.createElement('a'); link.href = url; link.download = `gmat-academy-${new Date().toISOString().slice(0, 10)}.json`; document.body.appendChild(link); link.click(); link.remove(); URL.revokeObjectURL(url); break; }
    case 'reset': if (confirm('Effacer toutes les données (réponses, examens, scores officiels) ? Cette action est définitive.')) { DB = freshDB(); save(); ui.step = null; go('home'); } break;
  }
});
document.addEventListener('change', e => {
  const s = e.target.closest('select[data-item]'); if (!s || !ui.cur) return;
  const q = QMAP[ui.cur.qid]; if (ui.cur.locked) return;
  const a = Array.isArray(ui.cur.a) ? ui.cur.a.slice() : q.items.map(() => null);
  a[+s.dataset.item] = s.value === '' ? null : +s.value; ui.cur.a = a; refreshPicks(q);
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.node')) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
});
let lastCols = null;
window.addEventListener('resize', () => { const c = window.innerWidth < 700 ? 2 : 4; if (ui.view === 'home' && c !== ui.cols) render(); });

load(); render();

</script>
